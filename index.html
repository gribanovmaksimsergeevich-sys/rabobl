<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рабочий Дашборд</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 20% 20%, #1a1f35 0%, #0c0e17 100%);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;

      --accent-blue: #38bdf8;
      --glow-blue: rgba(56, 189, 248, 0.55);

      --accent-emerald: #34d399;
      --glow-emerald: rgba(52, 211, 153, 0.55);

      --accent-amber: #fbbf24;
      --glow-amber: rgba(251, 191, 36, 0.55);

      --accent-rose: #f43f5e;
      --glow-rose: rgba(244, 63, 94, 0.55);

      --accent-violet: #a855f7;
      --glow-violet: rgba(168, 85, 247, 0.55);

      --accent-indigo: #818cf8;
      --glow-indigo: rgba(129, 140, 248, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 40px 20px 60px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
    }

    .top-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      max-width: 650px;
      margin: 0 auto;
    }

    .search-wrapper {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 13px 20px 13px 44px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
      background: rgba(255, 255, 255, 0.08);
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 18px;
      height: 18px;
    }

    .btn-add {
      padding: 13px 22px;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.35);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-add:hover {
      background: var(--primary-hover);
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.6);
      transform: translateY(-1px);
    }

    .section {
      margin-bottom: 35px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-transform: uppercase;
      letter-spacing: 0.9px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--card-border) 0%, transparent 100%);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px 20px;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px) scale(1.01);
      background: rgba(255, 255, 255, 0.06);
    }

    .card.neon-indigo:hover {
      border-color: var(--accent-indigo);
      box-shadow: 0 0 20px -2px var(--glow-indigo), inset 0 0 12px rgba(129, 140, 248, 0.15);
    }

    .card.neon-violet:hover {
      border-color: var(--accent-violet);
      box-shadow: 0 0 20px -2px var(--glow-violet), inset 0 0 12px rgba(168, 85, 247, 0.15);
    }

    .card.neon-blue:hover {
      border-color: var(--accent-blue);
      box-shadow: 0 0 20px -2px var(--glow-blue), inset 0 0 12px rgba(56, 189, 248, 0.15);
    }

    .card.neon-emerald:hover {
      border-color: var(--accent-emerald);
      box-shadow: 0 0 20px -2px var(--glow-emerald), inset 0 0 12px rgba(52, 211, 153, 0.15);
    }

    .card.neon-amber:hover {
      border-color: var(--accent-amber);
      box-shadow: 0 0 20px -2px var(--glow-amber), inset 0 0 12px rgba(251, 191, 36, 0.15);
    }

    .card.neon-rose:hover {
      border-color: var(--accent-rose);
      box-shadow: 0 0 20px -2px var(--glow-rose), inset 0 0 12px rgba(244, 63, 94, 0.15);
    }

    .card-content {
      display: flex;
      align-items: center;
      gap: 14px;
      overflow: hidden;
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .card:hover .icon-box {
      transform: scale(1.08);
    }

    .card-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-title {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-domain {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 8px;
    }

    .btn-edit {
      opacity: 0;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      cursor: pointer;
      border-radius: 8px;
      padding: 5px 7px;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .card:hover .btn-edit {
      opacity: 1;
    }

    .btn-edit:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.1);
    }

    .arrow-icon {
      color: var(--text-muted);
      opacity: 0;
      transform: translateX(-6px);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .card:hover .arrow-icon {
      opacity: 1;
      transform: translateX(0);
      color: #fff;
    }

    /* Цвета ярлыков */
    .bg-blue { background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.2); }
    .bg-emerald { background: rgba(52, 211, 153, 0.15); color: var(--accent-emerald); box-shadow: inset 0 0 10px rgba(52, 211, 153, 0.2); }
    .bg-amber { background: rgba(251, 191, 36, 0.15); color: var(--accent-amber); box-shadow: inset 0 0 10px rgba(251, 191, 36, 0.2); }
    .bg-rose { background: rgba(244, 63, 94, 0.15); color: var(--accent-rose); box-shadow: inset 0 0 10px rgba(244, 63, 94, 0.2); }
    .bg-violet { background: rgba(168, 85, 247, 0.15); color: var(--accent-violet); box-shadow: inset 0 0 10px rgba(168, 85, 247, 0.2); }
    .bg-indigo { background: rgba(129, 140, 248, 0.15); color: var(--accent-indigo); box-shadow: inset 0 0 10px rgba(129, 140, 248, 0.2); }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #141824;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), 0 0 30px rgba(99, 102, 241, 0.2);
    }

    .modal h2 {
      font-size: 1.35rem;
      margin-bottom: 20px;
      color: #fff;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
    }

    .tag-palette {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .tag-choice {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      cursor: pointer;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .tag-choice.selected {
      border-color: #fff;
      transform: scale(1.15);
      box-shadow: 0 0 12px currentColor;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
    }

    .btn-group-right {
      display: flex;
      gap: 10px;
    }

    .btn-secondary {
      padding: 10px 18px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-danger {
      padding: 10px 18px;
      border-radius: 8px;
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-rose);
      border: 1px solid rgba(244, 63, 94, 0.3);
      cursor: pointer;
      font-weight: 500;
    }
    
    .btn-danger:hover {
      background: rgba(244, 63, 94, 0.3);
      box-shadow: 0 0 12px var(--glow-rose);
    }

    .loader {
      text-align: center;
      padding: 50px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Панель Инструментов</h1>
      <div class="top-controls">
        <div class="search-wrapper">
          <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Поиск сервиса..." oninput="filterCards()" autofocus>
        </div>
        <button class="btn-add" onclick="openModal()">+ Добавить</button>
      </div>
    </header>

    <div id="sectionsContainer">
      <div class="loader">Загрузка данных из Supabase...</div>
    </div>
  </div>

  <!-- Модальное окно создания/редактирования -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">Добавить карточку</h2>
      <input type="hidden" id="cardId">

      <div class="form-group">
        <label>Категория</label>
        <input type="text" id="cardCategory" class="form-control" placeholder="Сервисы и Приложения" list="categoryOptions">
        <datalist id="categoryOptions"></datalist>
      </div>

      <div class="form-group">
        <label>Название</label>
        <input type="text" id="cardTitleInput" class="form-control" placeholder="Название сервиса">
      </div>

      <div class="form-group">
        <label>Ссылка (URL)</label>
        <input type="text" id="cardUrl" class="form-control" placeholder="https://example.com">
      </div>

      <div class="form-group">
        <label>Подзаголовок / Домен</label>
        <input type="text" id="cardDomain" class="form-control" placeholder="github.io (оставьте пустым для авто)">
      </div>

      <div class="form-group">
        <label>Иконка (Emoji)</label>
        <input type="text" id="cardIcon" class="form-control" placeholder="📊" maxlength="4">
      </div>

      <div class="form-group">
        <label>Цвет неонового ярлыка</label>
        <div class="tag-palette" id="tagPalette">
          <div class="tag-choice bg-indigo selected" data-color="indigo">●</div>
          <div class="tag-choice bg-violet" data-color="violet">●</div>
          <div class="tag-choice bg-blue" data-color="blue">●</div>
          <div class="tag-choice bg-emerald" data-color="emerald">●</div>
          <div class="tag-choice bg-amber" data-color="amber">●</div>
          <div class="tag-choice bg-rose" data-color="rose">●</div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-danger" id="btnDelete" onclick="deleteCard()" style="display: none;">Удалить</button>
        <div class="btn-group-right">
          <button type="button" class="btn-secondary" onclick="closeModal()">Отмена</button>
          <button type="button" class="btn-add" id="btnSave" onclick="saveCard()">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ВСТАВЬТЕ СЮДА ВАШИ ДАННЫЕ ИЗ НАСТРОЕК SUPABASE (Settings -> API)
    const SUPABASE_URL = 'https://cjgwbgcfbiknooglglkk.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'sb_secret_9-p-irts9Mi1HAAHH3r8aQ_SzFzWl8o';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let cards = [];
    let selectedTag = 'indigo';

    document.querySelectorAll('.tag-choice').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.tag-choice').forEach(t => t.classList.remove('selected'));
        el.classList.add('selected');
        selectedTag = el.dataset.color;
      });
    });

    async function loadCards() {
      const { data, error } = await supabase
        .from('dashboard_cards')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) {
        console.error('Ошибка загрузки:', error);
        document.getElementById('sectionsContainer').innerHTML = `<div class="loader" style="color:var(--accent-rose);">Ошибка подключения к базе. Проверьте URL и ключ Supabase.</div>`;
        return;
      }

      cards = data || [];
      renderDashboard();
    }

    function renderDashboard() {
      const container = document.getElementById('sectionsContainer');
      const datalist = document.getElementById('categoryOptions');
      container.innerHTML = '';
      datalist.innerHTML = '';

      if (cards.length === 0) {
        container.innerHTML = '<div class="loader">Нет сохраненных карточек. Нажмите "+ Добавить".</div>';
        return;
      }

      const categories = [...new Set(cards.map(c => c.category || 'Общее'))];
      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        datalist.appendChild(opt);
      });

      categories.forEach(cat => {
        const section = document.createElement('div');
        section.className = 'section';

        const title = document.createElement('div');
        title.className = 'section-title';
        title.innerText = cat;
        section.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'grid';

        const catCards = cards.filter(c => (c.category || 'Общее') === cat);
        catCards.forEach(c => {
          const cardTag = (c.tag || 'indigo').replace('bg-', '');
          const cardEl = document.createElement('a');
          cardEl.href = c.url;
          cardEl.target = '_blank';
          cardEl.className = `card neon-${cardTag}`;
          cardEl.innerHTML = `
            <div class="card-content">
              <div class="icon-box bg-${cardTag}">${c.icon || '🔗'}</div>
              <div class="card-info">
                <span class="card-title">${c.title}</span>
                <span class="card-domain">${c.domain || ''}</span>
              </div>
            </div>
            <div class="card-actions">
              <button type="button" class="btn-edit" title="Редактировать" onclick="event.preventDefault(); event.stopPropagation(); editCard('${c.id}')">✏️</button>
              <span class="arrow-icon">↗</span>
            </div>
          `;
          grid.appendChild(cardEl);
        });

        section.appendChild(grid);
        container.appendChild(section);
      });

      filterCards();
    }

    function openModal(card = null) {
      const modal = document.getElementById('modalOverlay');
      const btnDelete = document.getElementById('btnDelete');
      
      if (card) {
        document.getElementById('modalTitle').innerText = 'Редактировать карточку';
        document.getElementById('cardId').value = card.id;
        document.getElementById('cardCategory').value = card.category;
        document.getElementById('cardTitleInput').value = card.title;
        document.getElementById('cardUrl').value = card.url;
        document.getElementById('cardDomain').value = card.domain;
        document.getElementById('cardIcon').value = card.icon;
        selectedTag = (card.tag || 'indigo').replace('bg-', '');
        btnDelete.style.display = 'block';
      } else {
        document.getElementById('modalTitle').innerText = 'Добавить карточку';
        document.getElementById('cardId').value = '';
        document.getElementById('cardCategory').value = '';
        document.getElementById('cardTitleInput').value = '';
        document.getElementById('cardUrl').value = '';
        document.getElementById('cardDomain').value = '';
        document.getElementById('cardIcon').value = '🔗';
        selectedTag = 'indigo';
        btnDelete.style.display = 'none';
      }

      document.querySelectorAll('.tag-choice').forEach(t => {
        t.classList.toggle('selected', t.dataset.color === selectedTag);
      });

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function editCard(id) {
      const card = cards.find(c => c.id === id);
      if (card) openModal(card);
    }

    async function saveCard() {
      const btn = document.getElementById('btnSave');
      const id = document.getElementById('cardId').value;
      const category = document.getElementById('cardCategory').value.trim() || 'Общее';
      const title = document.getElementById('cardTitleInput').value.trim();
      const url = document.getElementById('cardUrl').value.trim();
      let domain = document.getElementById('cardDomain').value.trim();
      const icon = document.getElementById('cardIcon').value.trim() || '🔗';

      if (!title || !url) {
        alert('Заполните название и URL');
        return;
      }

      if (!domain) {
        try {
          domain = new URL(url).hostname;
        } catch {
          domain = '';
        }
      }

      btn.disabled = true;
      btn.innerText = 'Сохранение...';

      const cardPayload = {
        id: id || Date.now().toString(),
        category,
        title,
        url,
        domain,
        icon,
        tag: selectedTag
      };

      const { error } = await supabase
        .from('dashboard_cards')
        .upsert(cardPayload);

      btn.disabled = false;
      btn.innerText = 'Сохранить';

      if (error) {
        alert('Ошибка при сохранении: ' + error.message);
        return;
      }

      closeModal();
      await loadCards();
    }

    async function deleteCard() {
      const id = document.getElementById('cardId').value;
      if (!id || !confirm('Удалить эту карточку из базы?')) return;

      const btn = document.getElementById('btnDelete');
      btn.disabled = true;
      btn.innerText = 'Удаление...';

      const { error } = await supabase
        .from('dashboard_cards')
        .delete()
        .eq('id', id);

      btn.disabled = false;
      btn.innerText = 'Удалить';

      if (error) {
        alert('Ошибка при удалении: ' + error.message);
        return;
      }

      closeModal();
      await loadCards();
    }

    function filterCards() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cardsEls = document.querySelectorAll('.card');
      const sections = document.querySelectorAll('.section');

      cardsEls.forEach(card => {
        const title = card.querySelector('.card-title').innerText.toLowerCase();
        const domain = card.querySelector('.card-domain').innerText.toLowerCase();
        const match = title.includes(query) || domain.includes(query);
        card.style.display = match ? 'flex' : 'none';
      });

      sections.forEach(section => {
        const visibleCards = section.querySelectorAll('.card[style*="display: flex"]');
        if (query === '') {
          section.style.display = 'block';
        } else {
          section.style.display = visibleCards.length > 0 ? 'block' : 'none';
        }
      });
    }

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'modalOverlay') closeModal();
    });

    loadCards();
  </script>
</body>
</html>
